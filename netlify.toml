[build]
  command = "npm --prefix site ci && npm --prefix site run build"
  publish = "site/dist"

# Old WordPress intake page is retired — send it to contact.
[[redirects]]
  from   = "/intake"
  to     = "/contact/"
  status = 301

[[redirects]]
  from   = "/intake/*"
  to     = "/contact/"
  status = 301

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
